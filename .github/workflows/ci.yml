name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://symfony:symfony@database:3306/symfony_db?serverVersion=8.0.32&charset=utf8mb4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate composer.json
        run: composer validate --strict

      - name: Start Docker Compose services
        run: docker compose up -d --build database php

      - name: Install dependencies
        run: |
          docker compose exec php git config --global --add safe.directory /var/www/html
          docker compose exec php composer install --prefer-dist --no-progress --no-suggest --no-interaction

      - name: Wait for MySQL
        run: |
          docker compose exec php bash -lc '
            for i in $(seq 1 30); do
              php -r "try { new PDO(\"mysql:host=database;port=3306;dbname=symfony_db;charset=utf8mb4\", \"symfony\", \"symfony\"); exit(0);} catch (Throwable $e) { exit(1); }"
              if [ $? -eq 0 ]; then
                exit 0
              fi
              sleep 1
            done
            echo "MySQL did not become available in time"
            exit 1
          '

      - name: Run PHPUnit tests
        run: docker compose exec php bash -lc 'APP_ENV=test DATABASE_URL="$DATABASE_URL" vendor/bin/phpunit -c phpunit.xml --testsuite all'

      - name: Shutdown Docker Compose
        if: always()
        run: docker compose down --volumes
